[package]
name = "todex"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tdx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.0"
pathspec = "0.3.0"
textwrap = "0.16.4"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
dead_code = "allow" #?? cleanup later

[lints.clippy]
too_many_arguments = "allow"
