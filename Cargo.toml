[package]
name = "todex"
version = "0.1.1"
edition = "2024"

description = "CLI TODO extractor"
repository = "https://github.com/kaliv0/todex-rs.git"
keywords = ["TODO", "extractor", "cli"]
categories = ["development-tools"]
readme = "README.md"
license = "MIT"

[[bin]]
name = "tdx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.18"
ctrlc = { version = "3.5.2", features = ["termination"] }
fancy-regex = "0.20.0"
pathspec = "0.3.0"
textwrap = "0.16.4"

[dev-dependencies]
tempfile = "3.27.0"
